version: "3.8"

services:
  nodelink-manager:
    # Use pre-built image from GHCR
    image: ghcr.io/apocaliss92/nodelink-js-manager:latest

    # Or build locally (uncomment below and comment image above)
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    container_name: nodelink-manager
    restart: unless-stopped

    # Network mode host for RTSP streaming
    # This allows the container to bind RTSP servers on specific ports
    # and allows cameras to be discovered on the local network
    network_mode: host

    # Alternative: use bridge network with port mapping
    # Uncomment below and comment network_mode: host if you prefer isolation
    # ports:
    #   - "3000:3000"   # Web UI and API
    #   - "8554:8554"   # RTSP proxy
    #   - "50000-50100:50000-50100/udp" # WebRTC / ICE UDP (required for WebRTC in bridge mode)

    volumes:
      # Persist settings and logs
      - nodelink-data:/data

      # Optional: mount local settings file
      # - ./app/settings.json:/data/settings.json

    environment:
      - DATA_PATH=/data
      # Authentication (optional)
      # - AUTH_ENABLED=1
      # - ADMIN_PASSWORD=change-me
      # Override ports if needed
      # - PORT=3000
      # - RTSP_PORT=8554
      # WebRTC / ICE (bridge mode)
      # Configure in Settings → WebRTC (ICE)

    # Required for the in-app packet capture tool (tshark/dumpcap). Without
    # these caps the Capture page can list interfaces but Start will fail
    # with "permission denied". `network_mode: host` above also exposes the
    # host's interfaces (en0/eth0/...) so the capture sees real camera traffic.
    cap_add:
      - NET_RAW
      - NET_ADMIN

    # Healthcheck inherited from Dockerfile

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nodelink-data:
    driver: local
