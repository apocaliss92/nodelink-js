name: Release — Docker Image
run-name: "Docker ${{ github.event.inputs.increment || 'patch' }}"

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment"
        required: true
        type: choice
        options:
          - beta
          - rc
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compute version
        id: version
        run: |
          RAW=$(node -p "require('./app/package.json').version")
          INCREMENT="${{ github.event.inputs.increment }}"

          # Parse current version
          BASE="${RAW%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          CURRENT_CHANNEL=""
          CURRENT_BUILD="-1"
          if [[ "$RAW" == *"-"* ]]; then
            CURRENT_CHANNEL=$(echo "$RAW" | sed 's/[^-]*-\([a-z]*\)\..*/\1/')
            CURRENT_BUILD=$(echo "$RAW" | sed 's/.*\.\([0-9]*\)$/\1/')
          fi

          case "$INCREMENT" in
            beta|rc)
              if [ "$CURRENT_CHANNEL" == "$INCREMENT" ]; then
                VERSION="${BASE}-${INCREMENT}.$((CURRENT_BUILD + 1))"
              elif [ -n "$CURRENT_CHANNEL" ]; then
                VERSION="${BASE}-${INCREMENT}.0"
              else
                VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-${INCREMENT}.0"
              fi
              IS_PRERELEASE="true"
              DOCKER_CHANNEL="$INCREMENT"
              ;;
            patch)
              if [ -n "$CURRENT_CHANNEL" ]; then
                VERSION="${BASE}"
              else
                VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              fi
              IS_PRERELEASE="false"
              DOCKER_CHANNEL="latest"
              ;;
            minor)
              VERSION="${MAJOR}.$((MINOR + 1)).0"
              IS_PRERELEASE="false"
              DOCKER_CHANNEL="latest"
              ;;
            major)
              VERSION="$((MAJOR + 1)).0.0"
              IS_PRERELEASE="false"
              DOCKER_CHANNEL="latest"
              ;;
          esac

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "docker_channel=${DOCKER_CHANNEL}" >> $GITHUB_OUTPUT
          echo "${RAW} → ${VERSION} (increment=${INCREMENT})"

      - name: Bump app version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd app && npm version "${VERSION}" --no-git-tag-version --allow-same-version
          cd ..
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add app/package.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump app version to ${VERSION} [skip ci]"
            git push
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: tags
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMG="${{ env.REGISTRY }}/${OWNER_LC}/nodelink-js-manager"
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.docker_channel }}"

          TAGS="${IMG}:${VERSION}"
          if [ "$CHANNEL" == "latest" ]; then
            TAGS="${TAGS},${IMG}:latest"
          else
            TAGS="${TAGS},${IMG}:${CHANNEL}"
          fi

          echo "image=${IMG}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Nodelink.js Manager
            org.opencontainers.image.description=Web dashboard for Reolink cameras with go2rtc streaming
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Job Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IMG="${{ steps.tags.outputs.image }}"
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${IMG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${IMG}:${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
