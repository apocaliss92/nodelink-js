name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  library:
    name: Library — build, typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The lib's test suite includes integration tests under `test/app/**`
      # that import `app/src/*`. Those files now import the lib via package
      # name (`@apocaliss92/nodelink-js`), which only resolves when the
      # manager-app's own `node_modules` is populated (it carries the
      # `file:..` dep). Install it before running tests.
      - name: Install app dependencies (needed by integration tests)
        run: cd app && npm ci

      - name: Run tests
        run: npm test

  app:
    name: Manager App — build UI
    runs-on: ubuntu-latest
    needs: library
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build library (needed by app)
        run: npm run build

      - name: Install app dependencies
        run: cd app && npm ci

      - name: Type-check app
        run: cd app && npx tsc --noEmit

      - name: Build app UI
        run: cd app && npx vite build
