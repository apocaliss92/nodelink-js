name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ==========================================================================
  # Library: build + type-check + lint + test
  # ==========================================================================
  library:
    name: Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  # ==========================================================================
  # App: type-check + build UI
  # ==========================================================================
  app:
    name: Manager App
    runs-on: ubuntu-latest
    needs: library
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build library (needed by app)
        run: npm run build

      - name: Install app dependencies
        run: cd app && npm ci

      - name: Type-check app
        run: cd app && npx tsc --noEmit

      - name: Build app UI
        run: cd app && npx vite build
