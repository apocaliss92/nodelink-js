name: Release - NPM + Docker

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version increment type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      publish_npm:
        description: "Publish to NPM"
        required: true
        type: boolean
        default: true
      publish_docker:
        description: "Publish Docker image"
        required: true
        type: boolean
        default: true
      docker_tag:
        description: "Docker tag — 'latest' for stable release, or beta/rc/dev for pre-release"
        required: true
        type: choice
        options:
          - latest
          - beta
          - rc
          - dev
        default: latest
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  # ==========================================================================
  # Job 1: Version bump and library build
  # ==========================================================================
  build-library:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(join(github.event.commits.*.message, ' '), '[publish]'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      affected_lib: ${{ steps.affected.outputs.affected_lib }}
      affected_manager: ${{ steps.affected.outputs.affected_manager }}
      affected_projects: ${{ steps.affected.outputs.affected_projects }}
      base_ref: ${{ steps.affected.outputs.base_ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Get and increment version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Get current version from package.json
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            VERSION_TYPE="${{ github.event.inputs.version_type }}"
            
            # Calculate new version
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            case "$VERSION_TYPE" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            
            echo "Incremented version: ${CURRENT_VERSION} → ${VERSION} (${VERSION_TYPE})"
          elif [ "${{ github.event_name }}" == "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Use tag from push event (remove 'refs/tags/v' prefix)
            TAG="${{ github.ref }}"
            VERSION=${TAG#refs/tags/v}
            echo "Using version from tag: ${VERSION}"
          else
            # Fallback to package.json version
            VERSION=$(node -p "require('./package.json').version")
            echo "Using current version: ${VERSION}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Final version: ${VERSION}"

      - name: Update package.json version
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version
          # Also update app/package.json if needed
          cd app && npm version ${{ steps.version.outputs.version }} --no-git-tag-version || true

      - name: Install dependencies
        run: npm ci

      - name: Nx affected since last release
        id: affected
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_REF="${GITHUB_REF}"
          CURRENT_TAG=""
          if [[ "${CURRENT_REF}" == refs/tags/* ]]; then
            CURRENT_TAG="${CURRENT_REF#refs/tags/}"
          fi

          # Find latest and previous release tags by semver (vX.Y.Z).
          TAGS=$(git tag -l 'v*.*.*' --sort=-v:refname || true)
          LATEST_TAG=$(echo "$TAGS" | head -n 1 || true)
          if [[ -n "$CURRENT_TAG" ]]; then
            PREV_TAG=$(echo "$TAGS" | grep -vx "$CURRENT_TAG" | head -n 1 || true)
            BASE_REF="${PREV_TAG:-}"
            HEAD_REF="$CURRENT_TAG"
          else
            BASE_REF="${LATEST_TAG:-}"
            HEAD_REF="HEAD"
          fi

          # Fallback base when there are no tags yet.
          if [[ -z "$BASE_REF" ]]; then
            BASE_REF=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi

          echo "Base ref: $BASE_REF"
          echo "Head ref: $HEAD_REF"

          # Nx 19+: `print-affected` was removed. Use `nx show projects --affected`.
          AFFECTED_JSON=$(npx nx show projects --affected --base="$BASE_REF" --head="$HEAD_REF" --json || echo "[]")
          # Make sure it's a single line (safe for GITHUB_OUTPUT / logs).
          AFFECTED_JSON=$(echo "$AFFECTED_JSON" | tr -d '\r\n')

          AFFECTED_NL=$(node -e 'const fs=require("fs"); const raw=fs.readFileSync(0,"utf8").trim()||"[]"; const arr=JSON.parse(raw); console.log((Array.isArray(arr)?arr:[]).join("\n"));' <<< "$AFFECTED_JSON" | sed '/^$/d' | sort -u)
          AFFECTED=$(echo "$AFFECTED_NL" | tr '\n' ' ' | xargs)
          echo "Affected projects:" && echo "$AFFECTED_NL" || true

          AFFECTED_LIB=false
          if echo "$AFFECTED_NL" | grep -qx "nodelink-js"; then
            AFFECTED_LIB=true
          fi

          AFFECTED_MANAGER=false
          if echo "$AFFECTED_NL" | grep -qx "nodelink-manager"; then
            AFFECTED_MANAGER=true
          fi

          echo "affected_projects=$AFFECTED" >> $GITHUB_OUTPUT
          echo "affected_lib=$AFFECTED_LIB" >> $GITHUB_OUTPUT
          echo "affected_manager=$AFFECTED_MANAGER" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT

      - name: Build library
        run: npm run build

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-dist
          path: |
            dist/
            package.json
            README.md
            LICENSE
          retention-days: 1

      - name: Commit version bump (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package.json app/package.json || git add package.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
            git push
            echo "Version bump committed and pushed"
          fi

      - name: Create and push git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists"
          else
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} created and pushed"
          fi

  # ==========================================================================
  # Job 2: Publish to NPM
  # ==========================================================================
  publish-npm:
    needs: build-library
    if: |
      needs.build-library.outputs.affected_lib == 'true' && (
        (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_npm == 'true') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(join(github.event.commits.*.message, ' '), '[publish]'))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Download library artifact
        uses: actions/download-artifact@v4
        with:
          name: library-dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ==========================================================================
  # Job 3: Build and push Docker image
  # ==========================================================================
  publish-docker:
    needs: build-library
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_docker == 'true') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        contains(join(github.event.commits.*.message, ' '), '[publish]') &&
        (needs.build-library.outputs.affected_lib == 'true' || needs.build-library.outputs.affected_manager == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      # QEMU removed — builder stage runs amd64 only, production stage uses
      # COPY from builder (no emulation needed for node:22-alpine base image pull).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker-tags
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMG="${{ env.REGISTRY }}/${OWNER_LC}/nodelink-js-manager"
          VERSION="${{ needs.build-library.outputs.version }}"
          TAG="${{ github.event.inputs.docker_tag || 'latest' }}"

          # Always tag with version number
          TAGS="${IMG}:${VERSION}"

          if [ "$TAG" = "latest" ]; then
            # Stable release: version + latest
            TAGS="${TAGS},${IMG}:latest"
          else
            # Pre-release: version + tag (beta/rc/dev), NOT latest
            TAGS="${TAGS},${IMG}:${TAG}"
          fi

          echo "image=${IMG}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}
          build-args: |
            APP_VERSION=${{ needs.build-library.outputs.version }}${{ github.event.inputs.docker_tag != 'latest' && format('-{0}', github.event.inputs.docker_tag) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=Nodelink.js Manager
            org.opencontainers.image.description=Web dashboard for Reolink cameras with go2rtc streaming
            org.opencontainers.image.version=${{ needs.build-library.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # ==========================================================================
  # Job 4: Create GitHub Release
  # ==========================================================================
  create-release:
    needs: [build-library, publish-npm, publish-docker]
    if: |
      always() && 
      needs.build-library.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) &&
      (needs.publish-docker.result == 'success' || needs.publish-docker.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build-library.outputs.tag }}"
          VERSION="${{ needs.build-library.outputs.version }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi

          # Find previous tag
          PREV_TAG=$(git tag --list 'v*' --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)

          # Generate release notes
          REPO="${GITHUB_REPOSITORY}"
          if [ -n "$PREV_TAG" ]; then
            BASE_NOTES=$(gh api "repos/${REPO}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              -f previous_tag_name="${PREV_TAG}" \
              -f target_commitish="main" \
              --jq .body)
          else
            BASE_NOTES=$(gh api "repos/${REPO}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              -f target_commitish="main" \
              --jq .body)
          fi

          printf "%s\n\n" "$BASE_NOTES" > release_notes.md

          # Add installation section
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          if [ "${{ needs.publish-npm.result }}" = "success" ]; then
            echo "### NPM" >> release_notes.md
            echo "" >> release_notes.md
            echo "\`\`\`bash" >> release_notes.md
            echo "npm install @apocaliss92/nodelink-js@${VERSION}" >> release_notes.md
            echo "\`\`\`" >> release_notes.md
            echo "" >> release_notes.md
          else
            echo "### NPM" >> release_notes.md
            echo "" >> release_notes.md
            echo "_Skipped (no affected changes since last release)._" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # Add Docker section
          echo "### Docker" >> release_notes.md
          echo "" >> release_notes.md
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${OWNER_LC}/nodelink-js-manager"
          echo "Pull the Docker image:" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "# Latest" >> release_notes.md
          echo "docker pull ${IMG}:latest" >> release_notes.md
          echo "" >> release_notes.md
          echo "# Specific version" >> release_notes.md
          echo "docker pull ${IMG}:${VERSION}" >> release_notes.md
          echo "\`\`\`" >> release_notes.md
          echo "" >> release_notes.md
          echo "Or use docker-compose:" >> release_notes.md
          echo "" >> release_notes.md
          echo "\`\`\`bash" >> release_notes.md
          echo "wget https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/docker-compose.yml" >> release_notes.md
          echo "docker-compose up -d" >> release_notes.md
          echo "\`\`\`" >> release_notes.md

          gh release create "${TAG}" \
            --title "Release ${TAG}" \
            --notes-file release_notes.md
