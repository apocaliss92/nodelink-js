name: Release — NPM
run-name: "NPM ${{ github.event.inputs.increment || 'patch' }}"

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment"
        required: true
        type: choice
        options:
          - beta
          - rc
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Compute version
        id: version
        run: |
          RAW=$(node -p "require('./package.json').version")
          INCREMENT="${{ github.event.inputs.increment }}"

          # Parse current version: BASE = X.Y.Z, CHANNEL = beta|rc|"", BUILD = N
          BASE="${RAW%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          CURRENT_CHANNEL=""
          CURRENT_BUILD="-1"
          if [[ "$RAW" == *"-"* ]]; then
            CURRENT_CHANNEL=$(echo "$RAW" | sed 's/[^-]*-\([a-z]*\)\..*/\1/')
            CURRENT_BUILD=$(echo "$RAW" | sed 's/.*\.\([0-9]*\)$/\1/')
          fi

          case "$INCREMENT" in
            beta|rc)
              if [ "$CURRENT_CHANNEL" == "$INCREMENT" ]; then
                # Same channel: increment build (beta.2 → beta.3)
                VERSION="${BASE}-${INCREMENT}.$((CURRENT_BUILD + 1))"
              elif [ -n "$CURRENT_CHANNEL" ]; then
                # Different pre-release channel: promote (beta.3 → rc.0)
                VERSION="${BASE}-${INCREMENT}.0"
              else
                # Stable → new pre-release cycle: bump patch first (0.4.1 → 0.4.2-beta.0)
                VERSION="$((MAJOR)).$((MINOR)).$((PATCH + 1))-${INCREMENT}.0"
              fi
              NPM_TAG="$INCREMENT"
              IS_PRERELEASE="true"
              ;;
            patch)
              if [ -n "$CURRENT_CHANNEL" ]; then
                # Pre-release → stable: strip suffix (0.4.2-rc.1 → 0.4.2)
                VERSION="${BASE}"
              else
                # Stable → stable: bump patch (0.4.1 → 0.4.2)
                VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
              fi
              NPM_TAG="latest"
              IS_PRERELEASE="false"
              ;;
            minor)
              VERSION="${MAJOR}.$((MINOR + 1)).0"
              NPM_TAG="latest"
              IS_PRERELEASE="false"
              ;;
            major)
              VERSION="$((MAJOR + 1)).0.0"
              NPM_TAG="latest"
              IS_PRERELEASE="false"
              ;;
          esac

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "npm_tag=${NPM_TAG}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "${RAW} → ${VERSION} (increment=${INCREMENT}, npm_tag=${NPM_TAG})"

      - name: Install dependencies
        run: npm ci

      - name: Apply version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Build library
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public --tag "${{ steps.version.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump + tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add package.json package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump lib version to ${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi
          TAG="${{ steps.version.outputs.tag }}"
          if ! git rev-parse "${TAG}" >/dev/null 2>&1; then
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"; exit 0
          fi

          PREV_TAG=$(git tag --list 'v*' --sort=-creatordate | grep -v "^${TAG}$" | head -n 1 || true)
          NOTES_ARGS=(-f tag_name="${TAG}" -f target_commitish="main")
          [ -n "$PREV_TAG" ] && NOTES_ARGS+=(-f previous_tag_name="${PREV_TAG}")
          NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${NOTES_ARGS[@]}" --jq .body)

          printf "%s\n\n## Installation\n\n\`\`\`bash\nnpm install @apocaliss92/nodelink-js@%s\n\`\`\`\n" "$NOTES" "$VERSION" > release_notes.md

          PRERELEASE_FLAG=""
          [ "${{ steps.version.outputs.is_prerelease }}" == "true" ] && PRERELEASE_FLAG="--prerelease"
          gh release create "${TAG}" --title "Release ${TAG}" --notes-file release_notes.md ${PRERELEASE_FLAG}
